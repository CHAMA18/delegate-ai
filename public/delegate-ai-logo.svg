<?xml version="1.0" encoding="UTF-8"?>
<!-- Delegate.ai — refined logo mark v2 (The Relay) -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Delegate.ai logo">
  <defs>
    <linearGradient id="logoGradV2" x1="0%" y1="0%" x2="100%" y2="100%" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#c4abff"/>
      <stop offset="40%" stop-color="#8B5CF6"/>
      <stop offset="75%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
    <linearGradient id="logoSoftV2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0.18"/>
    </linearGradient>
    <radialGradient id="bgRadialV2" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#0A1E36"/>
      <stop offset="100%" stop-color="#031427"/>
    </radialGradient>
    <filter id="softGlowV2" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="6"/>
      <feOffset dx="0" dy="4" result="offsetblur"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.5"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect x="0" y="0" width="512" height="512" rx="112" ry="112" fill="url(#bgRadialV2)"/>
  <circle cx="256" cy="256" r="200" fill="url(#logoSoftV2)"/>

  <!-- Dotted transfer trail -->
  <g opacity="0.7">
    <circle cx="180" cy="256" r="3.5" fill="url(#logoGradV2)"/>
    <circle cx="200" cy="256" r="3" fill="url(#logoGradV2)"/>
    <circle cx="220" cy="256" r="2.5" fill="url(#logoGradV2)"/>
    <circle cx="240" cy="256" r="2" fill="url(#logoGradV2)"/>
    <circle cx="258" cy="256" r="1.6" fill="url(#logoGradV2)"/>
    <circle cx="274" cy="256" r="1.2" fill="url(#logoGradV2)"/>
  </g>

  <!-- Left chevron (solid) — originator -->
  <g filter="url(#softGlowV2)">
    <path d="M 96 144 L 96 368 L 168 368 L 168 296 L 232 256 L 168 216 L 168 144 Z" fill="url(#logoGradV2)"/>
  </g>

  <!-- Right chevron (outlined) — agent -->
  <path
    d="M 280 144 L 280 216 L 344 256 L 280 296 L 280 368 L 416 256 Z"
    fill="none"
    stroke="url(#logoGradV2)"
    stroke-width="14"
    stroke-linejoin="round"
    stroke-linecap="round"
  />

  <!-- .ai accent dot -->
  <circle cx="416" cy="368" r="10" fill="url(#logoGradV2)"/>
  <circle cx="416" cy="368" r="4" fill="#031427"/>
</svg>
