<?xml version="1.0" encoding="UTF-8"?>
<!-- Delegate.ai — horizontal lockup with wordmark -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 160" width="640" height="160" role="img" aria-label="Delegate.ai">
  <defs>
    <linearGradient id="lockupGradient" x1="0%" y1="0%" x2="100%" y2="100%" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#c4abff"/>
      <stop offset="40%" stop-color="#8B5CF6"/>
      <stop offset="70%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
    <linearGradient id="wordGradient" x1="0%" y1="0%" x2="100%" y2="0%" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#d3e4fe"/>
      <stop offset="100%" stop-color="#c4abff"/>
    </linearGradient>
    <filter id="softGlowLockup" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
      <feOffset dx="0" dy="2" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.4"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Icon (left side) - scaled & centered in 160x160 box -->
  <g transform="translate(0, 0)">
    <!-- Background rounded square -->
    <rect x="20" y="20" width="120" height="120" rx="28" ry="28" fill="#0b1c30" stroke="#26364a" stroke-width="1"/>

    <!-- Dotted transfer trail -->
    <g opacity="0.65">
      <circle cx="60" cy="80" r="2" fill="url(#lockupGradient)"/>
      <circle cx="68" cy="80" r="1.8" fill="url(#lockupGradient)"/>
      <circle cx="76" cy="80" r="1.5" fill="url(#lockupGradient)"/>
      <circle cx="84" cy="80" r="1.2" fill="url(#lockupGradient)"/>
      <circle cx="91" cy="80" r="1" fill="url(#lockupGradient)"/>
    </g>

    <!-- Left chevron (solid) -->
    <g filter="url(#softGlowLockup)">
      <path
        d="M 42 50
           L 42 110
           L 64 110
           L 64 88
           L 84 80
           L 64 72
           L 64 50
           Z"
        fill="url(#lockupGradient)"
      />
    </g>

    <!-- Right chevron (outlined) -->
    <path
      d="M 96 50
         L 96 72
         L 116 80
         L 96 88
         L 96 110
         L 138 80
         Z"
      fill="none"
      stroke="url(#lockupGradient)"
      stroke-width="4.5"
      stroke-linejoin="round"
      stroke-linecap="round"
    />

    <!-- .ai dot accent -->
    <circle cx="138" cy="110" r="3" fill="url(#lockupGradient)"/>
  </g>

  <!-- Wordmark "Delegate" + ".ai" -->
  <g transform="translate(170, 0)" font-family="Inter, system-ui, -apple-system, sans-serif" font-weight="700">
    <text x="0" y="98" font-size="58" letter-spacing="-2.5" fill="url(#wordGradient)">Delegate</text>
    <text x="298" y="98" font-size="58" letter-spacing="-2.5" fill="url(#lockupGradient)">.ai</text>
  </g>
</svg>
